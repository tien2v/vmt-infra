<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>VMT Console</title>
<style>
  :root { --bg:#000; --card:#1f1f1e; --line:#353533; --text:#fffefc; --sub:#817f7c; --brand:#f2ae00; --ok:#c6ff85; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; padding:16px; }
  .card { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:28px; }
  .logo { font-weight:700; font-size:20px; } .logo span { color:var(--brand); }
  h1 { font-size:24px; margin:20px 0 8px; font-weight:600; }
  p { color:var(--sub); font-size:14px; line-height:1.6; margin:0; }
  .row { display:flex; justify-content:space-between; font-size:13px; padding:10px 0; border-top:1px solid var(--line); }
  .row:first-of-type { margin-top:20px; }
  .ok { color:var(--ok); }
</style>
</head>
<body>
  <main class="card">
    <div class="logo">VMT<span>global</span> Console</div>
    <h1>Hệ thống đang được xây dựng</h1>
    <p>Máy chủ đã sẵn sàng. Giao diện khách và trang quản trị sẽ được cập nhật tại đây.</p>
    <div class="row"><span>Web</span><span class="ok">● Đang chạy</span></div>
    <div class="row"><span>Database</span><span class="ok">● Đang chạy</span></div>
  </main>
</body>
</html>
