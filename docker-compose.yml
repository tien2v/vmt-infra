services:
  web:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./khach.caddy:/etc/caddy/khach.caddy:ro
      - ./www:/srv/www:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    depends_on:
      - app

  # Trang admin VMT Console (Node 22, du lieu trong ./appdata)
  app:
    build: ./app
    restart: unless-stopped
    environment:
      COOKIE_SECURE: "1"
    volumes:
      - ./appdata:/data
    # Khong mo cong ra ngoai: chi Caddy goi vao

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    # Khong mo cong ra ngoai: database chi dung noi bo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      retries: 5
