<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thông báo cho khách · VMT</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f5f7;color:#1f2937}
main{max-width:720px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:22px;margin:0 0 4px}p.sub{color:#6b7280;margin:0 0 20px}
.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h2{font-size:16px;margin:0 0 12px}
label{display:block;margin:12px 0 4px;font-size:14px;color:#374151;font-weight:500}
input,textarea,select{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #d1d5db;border-radius:10px;font-size:14px;font-family:inherit}
textarea{min-height:80px;resize:vertical}
small{color:#6b7280}
button{border:0;border-radius:10px;padding:11px 18px;font-size:15px;font-weight:600;cursor:pointer;background:#4f46e5;color:#fff}
button.sec{background:#eef2ff;color:#4338ca}button.sm{padding:6px 12px;font-size:13px}button:disabled{opacity:.5;cursor:default}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.two{grid-template-columns:1fr}}
.err{color:#b91c1c;margin-top:10px;white-space:pre-wrap}
.it{display:flex;gap:12px;padding:12px 0;border-top:1px solid #f0f0f0}.it:first-child{border-top:0}
.it img{width:64px;height:64px;object-fit:cover;border-radius:10px;flex:none}
.it .t{flex:1;min-width:0;font-size:14px;white-space:pre-wrap}.it .m{font-size:12px;color:#6b7280;margin-top:4px}
.it .a{display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:6px;padding:2px 6px;margin-right:4px}
.on{background:#dcfce7;color:#15803d}.off{background:#f3f4f6;color:#6b7280}.wait{background:#fef3c7;color:#92400e}
.pv{margin-top:8px}.pv img{max-width:160px;border-radius:10px;display:block;margin-bottom:6px}
a{color:#4f46e5}
</style></head><body><main>
<p><a href="/">← Về trang quản trị</a></p>
<h1>Thông báo cho khách</h1>
<p class="sub">Hiện trên trang chủ app khách. Chỉ có chữ: thanh nhỏ, khách bấm X để tắt. Có ảnh: hiện popup riêng 1 lần trên mỗi máy.</p>

<div class="card"><h2 id="fTitle">Đăng thông báo mới</h2>
  <label for="tx">Nội dung (tối đa 300 ký tự)</label>
  <textarea id="tx" maxlength="300" placeholder="Kho Quảng Châu nghỉ lễ 1–3/11, hàng về chậm 2 ngày"></textarea>
  <label>Ảnh (không bắt buộc)</label>
  <input type="file" id="img" accept="image/*">
  <div class="pv" id="pv"></div>
  <div class="two">
    <div><label for="br">Thương hiệu</label><select id="br"><option value="all">Cả 2 thương hiệu</option><option value="green">Vominhthien</option><option value="yellow">VMT Global</option></select></div>
    <div></div>
    <div><label for="st">Bắt đầu hiện (bỏ trống = ngay)</label><input type="datetime-local" id="st"></div>
    <div><label for="en">Hết hạn (bỏ trống = tới khi tắt)</label><input type="datetime-local" id="en"></div>
  </div>
  <div style="display:flex;gap:10px;margin-top:16px"><button id="save">Đăng</button><button class="sec" id="cancel" hidden>Huỷ sửa</button></div>
  <div class="err" id="err"></div>
</div>

<div class="card"><h2>Đã đăng</h2><div id="list">Đang tải…</div></div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BR={all:'Cả 2',green:'Vominhthien',yellow:'VMT Global'};
let items=[],editId=0,imgId=null;
const local=v=>{if(!v)return '';const d=new Date(v);const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());};
const show=v=>v?new Date(v).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
function state(x){const n=new Date().toISOString();if(!x.active)return['off','Đã tắt'];if(x.end&&x.end<=n)return['off','Hết hạn'];if(x.start&&x.start>n)return['wait','Chờ tới giờ'];return['on','Đang hiện'];}
async function load(){try{const r=await fetch('/api/announce',{cache:'no-store'});const j=await r.json();if(!r.ok)throw new Error(j.error);items=j.items;draw();}catch(e){$('#list').textContent=e.message||'Lỗi tải';}}
function draw(){$('#list').innerHTML=items.length?items.map(x=>{const [c,l]=state(x);return `<div class="it">${x.img?`<img src="/cnimg/${x.img}.jpg" alt="">`:''}<div class="t">${esc(x.text)}<div class="m"><span class="tag ${c}">${l}</span><span class="tag off">${BR[x.brand]}</span>${x.start?'từ '+show(x.start)+' ':''}${x.end?'tới '+show(x.end)+' ':''}· ${esc(x.by||'')} · ${show(x.created)}</div></div><div class="a"><button class="sec sm" data-ed="${x.id}">Sửa</button><button class="sec sm" data-tg="${x.id}" data-on="${x.active?0:1}">${x.active?'Tắt':'Bật lại'}</button></div></div>`;}).join(''):'<small>Chưa có thông báo nào.</small>';}
function reset(){editId=0;imgId=null;$('#tx').value='';$('#img').value='';$('#pv').innerHTML='';$('#st').value='';$('#en').value='';$('#br').value='all';$('#fTitle').textContent='Đăng thông báo mới';$('#save').textContent='Đăng';$('#cancel').hidden=true;$('#err').textContent='';}
function pv(){$('#pv').innerHTML=imgId?`<img src="/cnimg/${imgId}.jpg" alt=""><button class="sec sm" id="rmImg">Bỏ ảnh</button>`:'';const b=$('#rmImg');if(b)b.onclick=()=>{imgId=null;$('#img').value='';pv();};}
// Nen anh tren trinh duyet (canh dai toi da 1600px, JPEG) roi tai len
function toJpeg(file,max){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(im.src);c.toBlob(b=>b?ok(b):no(new Error('Không đọc được ảnh')),'image/jpeg',.85);};im.onerror=()=>no(new Error('Không đọc được ảnh'));im.src=URL.createObjectURL(file);});}
$('#img').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#err').textContent='Đang tải ảnh…';try{const b=await toJpeg(f,1600);const r=await fetch('/api/cn/upload',{method:'POST',headers:{'Content-Type':'image/jpeg'},body:b});const j=await r.json();if(!r.ok)throw new Error(j.error);imgId=j.id;pv();$('#err').textContent='';}catch(x){$('#err').textContent=x.message;}};
$('#save').onclick=async()=>{const b=$('#save');b.disabled=true;$('#err').textContent='';try{const st=$('#st').value,en=$('#en').value;const r=await fetch('/api/announce',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:editId||undefined,text:$('#tx').value,img:imgId,brand:$('#br').value,start:st?new Date(st).toISOString():null,end:en?new Date(en).toISOString():null})});const j=await r.json();if(!r.ok)throw new Error(j.error);reset();load();}catch(x){$('#err').textContent=x.message;}finally{b.disabled=false;}};
$('#cancel').onclick=reset;
document.addEventListener('click',async e=>{const ed=e.target.closest('[data-ed]');if(ed){const x=items.find(i=>i.id==ed.dataset.ed);if(!x)return;editId=x.id;imgId=x.img;$('#tx').value=x.text;$('#br').value=x.brand;$('#st').value=local(x.start);$('#en').value=local(x.end);pv();$('#fTitle').textContent='Sửa thông báo #'+x.id;$('#save').textContent='Lưu';$('#cancel').hidden=false;scrollTo(0,0);return;}
 const tg=e.target.closest('[data-tg]');if(tg){tg.disabled=true;try{const r=await fetch('/api/announce/'+tg.dataset.tg+'/'+(tg.dataset.on==='1'?'on':'off'),{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const j=await r.json();if(!r.ok)throw new Error(j.error);load();}catch(x){alert(x.message);tg.disabled=false;}}});
load();
</script>
</body></html>
