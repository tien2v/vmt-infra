<div class="app" id="app">
  <section class="inbox">
    <div class="top"><a class="ibtn" href="/" title="Về trang quản trị"><i class="fa-solid fa-arrow-left"></i></a><h1><span class="lv" id="lv" title="Đang kết nối…"></span>Tin nhắn</h1>
      <button class="ibtn" id="pushBtn" title="Thông báo trên điện thoại"><i class="fa-solid fa-mobile-screen"></i></button><button class="ibtn" id="sndBtn" title="Âm báo"><i class="fa-solid fa-bell"></i></button>
      <button class="ibtn" id="tplBtn" title="Mẫu câu &amp; nhãn"><i class="fa-solid fa-bolt"></i></button><button class="ibtn" id="newBtn" title="Nhắn khách mới"><i class="fa-solid fa-pen-to-square"></i></button></div>
    <div class="srch"><i class="fa-solid fa-magnifying-glass"></i><input type="search" id="q" placeholder="Tìm khách, mã đơn, nội dung…"><button class="ibtn ft" id="ftBtn" title="Lọc theo nhãn"><i class="fa-solid fa-tag"></i></button></div>
    <div class="tabs" id="tabs"></div>
    <div class="tagbar hide" id="tagbar"></div>
    <div class="list" id="list"><div class="empty">Đang tải…</div></div>
  </section>
  <section class="th hide" id="th">
    <div class="th-h"><button class="ibtn bk" id="backBtn"><i class="fa-solid fa-arrow-left"></i></button><span class="av" id="thAv"></span>
      <div class="who"><b id="thName"></b><small id="thSub"></small></div>
      <div class="acts"><button class="asg" id="asgBtn" title="Người phụ trách"></button><button class="ibtn" id="tagBtn" title="Gắn nhãn"><i class="fa-solid fa-tag"></i></button>
        <button class="btn sm" id="doneBtn"></button><button class="ibtn" id="pfBtn" title="Hồ sơ khách"><i class="fa-solid fa-circle-info"></i></button></div></div>
    <div id="obar"></div>
    <div class="ms" id="ms"></div><div class="typ" id="typ"></div>
    <div class="cp"><div class="mode"><button id="mReply" class="on">Trả lời khách</button><button id="mNote" class="nt2"><i class="fa-solid fa-lock"></i> Ghi chú nội bộ</button><span class="sp"></span></div>
      <div id="sug"></div><div id="rb"></div><div class="pv hide" id="pv"></div>
      <div class="inr" id="inr"><div class="tp hide" id="tp"></div><div class="emo-p hide" id="emoP"></div>
        <div class="tools2"><button class="ibtn" id="imgBtn" title="Gửi ảnh / video"><i class="fa-solid fa-paperclip"></i></button><button class="ibtn" id="emoBtn" title="Biểu tượng cảm xúc"><i class="fa-regular fa-face-smile"></i></button></div>
        <textarea id="in" rows="1" placeholder="Nhắn khách… (gõ / chọn mẫu)"></textarea>
        <div class="tools2"><button class="ibtn" id="aiBtn" title="AI gợi ý câu trả lời"><i class="fa-solid fa-wand-magic-sparkles"></i></button><button class="snd" id="sendBtn" disabled><i class="fa-solid fa-paper-plane"></i></button></div></div>
      <div class="hint">Enter gửi · Shift+Enter xuống dòng · / mẫu câu · dán ảnh Ctrl+V hoặc kéo thả · ✨ AI gợi ý</div>
      <input type="file" id="file" accept="image/*,video/*" multiple hidden></div>
  </section>
  <aside class="pfp hide" id="pf"></aside>
</div>
<div id="toast" class="hide"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isM=()=>innerWidth<1024;
const EMO=['❤️','👍','😂','😮','😢','😡'];
const EMO2=['😊','😁','🙏','👍','👌','❤️','🥰','😂','😅','🤔','😮','😢','🙇','💪','🎉','✅','📦','🚚','✈️','💰','⏰','📞','👉','⚠️'];
const KN={order:'Đặt hàng',ship:'Ký gửi',peer:'Thanh toán hộ',cn:'Ship to China',vmt:'Chung'};
const KI={order:'fa-cart-shopping',ship:'fa-box',peer:'fa-wallet',cn:'fa-plane-departure',vmt:'fa-comments'};
const F=[['unread','Chưa đọc'],['mine','Của tôi'],['free','Chưa nhận'],['wait','Đang chờ'],['all','Tất cả'],['done','Xong']];
const post=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Lỗi');return j;});
const getJ=u=>fetch(u,{cache:'no-store'}).then(async r=>{if(r.status===401){location.href='/login';throw new Error('login');}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Lỗi');return j;});
let tT=0;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.remove('hide');clearTimeout(tT);tT=setTimeout(()=>t.classList.add('hide'),2600);};
const tHM=s=>new Date(s).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
const shortT=s=>{if(!s)return'';const d=new Date(s),n=new Date();if(d.toDateString()===n.toDateString())return tHM(s);return d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'});};
const dayL=s=>{const d=new Date(s),n=new Date();if(d.toDateString()===n.toDateString())return'Hôm nay';const y=new Date(n);y.setDate(n.getDate()-1);if(d.toDateString()===y.toDateString())return'Hôm qua';return d.toLocaleDateString('vi-VN',{weekday:'long',day:'2-digit',month:'2-digit'});};
const ini=n=>{const w=String(n||'?').trim().split(/\s+/);return(w.length>1?w[w.length-2][0]+w[w.length-1][0]:w[0].slice(0,2)).toUpperCase();};
const avc=n=>{let h=0;for(const c of String(n||''))h=(h*31+c.charCodeAt(0))>>>0;return 'av'+(h%8);};
const av=(n,cls)=>`<span class="av ${cls||''} ${avc(n)}">${esc(ini(n))}</span>`;
const VND=n=>n==null?'—':Math.round(n).toLocaleString('vi-VN')+'đ';
const cname=t=>t.owner&&t.owner.startsWith('test:')?'TEST · '+t.owner.slice(5):(t.fn||t.u||t.owner);
const ctxL=t=>t.ctx==='vmt'?'Chat chung':(KN[t.kind]&&t.kind!=='vmt'?KN[t.kind]+' ':'Đơn ')+t.code;
const waitM=t=>t.waitAt?Math.floor((Date.now()-Date.parse(t.waitAt))/6e4):-1;
const sn=u=>u?((S.staff.find(s=>s.u===u)||{n:u}).n):'';
const tagH=id=>{const g=S.tags.find(x=>x.id===id);return g?`<span class="tag c-${esc(g.color)}">${esc(g.name)}</span>`:'';};

const S={f:'unread',q:'',tag:0,list:[],counts:{},me:{},staff:[],tags:[],ai:false,cur:null,msgs:[],more:false,reply:null,att:[],note:false,tpl:[],ctx:null,pf:null,typT:0,seenC:0,test:false};
let soundOn=localStorage.getItem('vmt_schat_snd')!=='0';
const sndIco=()=>{$('#sndBtn').innerHTML=`<i class="fa-solid ${soundOn?'fa-bell':'fa-bell-slash'}"></i>`;};sndIco();
/* chi ve lai phan thay doi -> muot, anh + video khong tai lai */
function patch(box,items){const old=new Map();for(const n of box.children)if(n.dataset.k)old.set(n.dataset.k,n);let prev=null;const keep=new Set();
 for(const[k,h]of items){let n=old.get(k);if(!n||n._h!==h){const t=document.createElement('template');t.innerHTML=h.trim();const nn=t.content.firstElementChild;nn.dataset.k=k;nn._h=h;if(n)n.replaceWith(nn);n=nn;}
  keep.add(n);const want=prev?prev.nextElementSibling:box.firstElementChild;if(n!==want)box.insertBefore(n,want);prev=n;}
 for(const n of [...box.children])if(!keep.has(n))n.remove();}

/* ===== cot 1: hop thu ===== */
function tabs(){const c=S.counts||{};const h=F.map(([k,l])=>`<button data-f="${k}" class="${S.f===k?'on':''}">${l}${c[k]?`<em>${c[k]}</em>`:''}</button>`).join('')+(S.me.role==='admin'?`<button data-test class="${S.test?'on':''}">Test</button>`:'');
 if($('#tabs')._h!==h){$('#tabs').innerHTML=h;$('#tabs')._h=h;const on=$('#tabs .on');if(on)on.scrollIntoView({block:'nearest',inline:'nearest'});}
 const g=S.tag&&S.tags.find(x=>x.id===S.tag);const tb=$('#tagbar');tb.classList.toggle('hide',!g);$('#ftBtn').classList.toggle('on',!!g);
 if(g)tb.innerHTML=`<i class="fa-solid fa-tag"></i>Đang lọc nhãn <span class="tag c-${esc(g.color)}">${esc(g.name)}</span><button data-tag="0">Bỏ lọc ✕</button>`;}
function rowH(t){const w=waitM(t);const on=S.cur&&S.cur.id===t.id;const nm=cname(t);
 const pre=(t.lastFrom==='k'?'':t.lastFrom==='sys'?'Hệ thống: ':(t.lastFrom==='s'?(t.lastName?t.lastName.split(/\s+/).pop():'NV')+': ':''))+(t.lastText||'');
 return `<button class="row${t.unread?' unread':''}${on?' on':''}" data-t="${t.id}">${av(nm)}<span style="min-width:0"><span class="nm"><b>${esc(nm)}</b>${t.ccode?`<small>${esc(t.ccode)}</small>`:''}${t.test?'<span class="tag c-warning">TEST</span>':''}</span>
<span class="l2"><span class="tag c-${t.ctx==='vmt'?'slate':'primary'}"><i class="fa-solid ${KI[t.kind]||'fa-box'}"></i>${esc(ctxL(t))}</span>${(t.tags||[]).map(tagH).join('')}</span><span class="pre">${esc(pre)}</span></span>
<span class="meta">${shortT(t.lastAt)}${t.unread?`<span class="bdg">${t.unread>9?'9+':t.unread}</span>`:''}${w>=0&&t.status==='open'?`<span class="wt ${w>=15?'r':w>=5?'y':''}"><i class="fa-regular fa-clock"></i> ${w<60?w+"'":Math.floor(w/60)+'h'}</span>`:''}${t.assignee?`<span title="${esc(sn(t.assignee))}">${av(sn(t.assignee),'xs')}</span>`:t.status==='open'?`<span class="btn sm grab" data-grab="${t.id}">Nhận</span>`:''}</span></button>`;}
function renderList(){tabs();patch($('#list'),S.list.length?S.list.map(t=>['t'+t.id,rowH(t)]):[['empty',`<div class="empty"><i class="fa-regular fa-comments"></i>${S.tag?'Không có cuộc chat nào gắn nhãn này<br><button class="btn sm" data-tag="0" style="margin-top:8px">Bỏ lọc nhãn</button>':S.q?'Không tìm thấy':S.f==='unread'?'Không còn tin chưa đọc 👍':'Không có cuộc chat nào'}</div>`]]);}
let lT=0;const loadSoon=()=>{clearTimeout(lT);lT=setTimeout(load,400);};
async function load(){try{const j=await getJ('/api/chat/inbox?f='+S.f+'&q='+encodeURIComponent(S.q)+(S.tag?'&tag='+S.tag:'')+(S.test?'&test=1':''));S.list=j.threads||[];S.counts=j.counts||{};S.me=j.me||{};S.staff=j.staff||[];S.tags=j.tags||[];S.ai=!!j.ai;
 renderList();document.title=(S.counts.unread?'('+S.counts.unread+') ':'')+'Tin nhắn khách · VMT';try{if(navigator.setAppBadge)S.counts.unread?navigator.setAppBadge(S.counts.unread):navigator.clearAppBadge();}catch(e){}
 if(S.cur){const t=S.list.find(x=>x.id===S.cur.id);if(t){Object.assign(S.cur,t);head();}}}catch(e){}}
setInterval(()=>{if(!document.hidden)renderList();},30000);
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.test!==undefined)S.test=!S.test;else S.f=b.dataset.f;load();};
$('#tagbar').onclick=e=>{if(e.target.closest('[data-tag]')){S.tag=0;load();}};
$('#ftBtn').onclick=()=>{const o=dlg(`<h3>Lọc theo nhãn</h3><div class="pick"><button data-tg="0"><i class="fa-solid fa-xmark" style="width:28px;text-align:center;color:var(--s400)"></i><span><b>Không lọc</b></span></button>${S.tags.map(g=>`<button data-tg="${g.id}"><span class="tag c-${esc(g.color)}">${esc(g.name)}</span>${S.tag===g.id?'<i class="fa-solid fa-check" style="margin-left:auto;color:var(--p)"></i>':''}</button>`).join('')}</div>`);
 o.addEventListener('click',e=>{const b=e.target.closest('[data-tg]');if(!b)return;o.remove();S.tag=+b.dataset.tg;if(S.tag&&S.f==='unread')S.f='all';load();});};
let qT=0;$('#q').oninput=e=>{clearTimeout(qT);qT=setTimeout(()=>{S.q=e.target.value.trim();if(S.q&&S.f==='unread')S.f='all';load();},300);};
$('#list').onclick=async e=>{if(e.target.closest('[data-tag]')){S.tag=0;load();return;}const g=e.target.closest('[data-grab]');if(g){e.stopPropagation();try{await post('/api/chat/t/'+g.dataset.grab+'/assign',{to:S.me.u});toast('Đã nhận cuộc chat');load();}catch(x){toast(x.message);}return;}
 const r=e.target.closest('[data-t]');if(r)openT(+r.dataset.t);};

/* ===== cot 2: cuoc chat ===== */
function head(){const t=S.cur;if(!t||!t.ctx)return;const nm=cname(t);
 $('#thAv').className='av '+avc(nm);$('#thAv').textContent=ini(nm);$('#thName').textContent=nm+(t.ccode?' · '+t.ccode:'');
 $('#thSub').innerHTML=`<span class="tag c-${t.ctx==='vmt'?'slate':'primary'}"><i class="fa-solid ${KI[t.kind]||'fa-box'}"></i>${esc(ctxL(t))}</span>${(t.tags||[]).map(tagH).join('')}${t.status==='done'?'<span class="tag c-success">Đã xử lý</span>':''}`;
 $('#asgBtn').innerHTML=t.assignee?`${av(sn(t.assignee),'xs')}<span>${esc(sn(t.assignee))}</span>`:`<i class="fa-solid fa-user-plus" style="padding:0 4px;color:var(--s400)"></i><span>Chưa ai nhận</span>`;
 $('#doneBtn').className='btn sm'+(t.status==='done'?'':' ok');$('#doneBtn').innerHTML=t.status==='done'?'<i class="fa-solid fa-rotate-left"></i><span class="tx">Mở lại</span>':'<i class="fa-solid fa-check"></i><span class="tx">Xong</span>';
 const o=S.ctx&&S.ctx.order;
 $('#obar').innerHTML=o?`<div class="obar"><span class="oi"><i class="fa-solid ${KI[o.k]||'fa-box'}"></i></span><span class="ot"><b>${esc(o.code)}</b> · ${esc(KN[o.k]||'Đơn')}<small>${esc(o.stl||'Chưa có trạng thái (đơn mới / quá 30 ngày)')}${o.unpaid?` · <span class="red">còn thiếu ${VND(o.unpaid)}</span>`:''}</small></span>
${o.unpaid?`<button class="btn sm" data-sendpay="${esc(o.code)}" data-k="${esc(o.k)}"><i class="fa-solid fa-file-invoice-dollar"></i>Gửi thẻ thanh toán</button>`:''}<button class="btn sm" data-sendcard="${esc(o.code)}" data-k="${esc(o.k)}"><i class="fa-solid fa-box"></i><span class="tx">Thẻ đơn</span></button></div>`:'';
 $('#aiBtn').classList.toggle('hide',!S.ai);}
async function openT(id,keep){
 S.cur={id};S.msgs=[];S.reply=null;S.att=[];S.more=false;S.ctx=null;S.pf=null;$('#sug').innerHTML='';renderRb();renderPv();
 $('#th').classList.remove('hide');$('#ms').innerHTML='<div class="empty">Đang tải…</div>';$('#obar').innerHTML='';renderList();
 if(!keep)history.replaceState(null,'','#t'+id);
 try{const [j,c]=await Promise.all([getJ('/api/chat/t/'+id),getJ('/api/chat/t/'+id+'/ctx').catch(()=>null)]);if(!S.cur||S.cur.id!==id)return;
  S.cur=j.thread;S.ctx=c;S.seenC=j.thread.seenByCust||0;S.msgs=j.msgs||[];S.more=S.msgs.length>=50;head();render(true);markRead();
  if($('#app').classList.contains('pf')||(!isM()&&innerWidth>=1280&&localStorage.getItem('vmt_pf')!=='0'))showPf(true);}
 catch(e){$('#ms').innerHTML=`<div class="empty">${esc(e.message)}</div>`;}
 if(!isM())$('#in').focus();}
$('#backBtn').onclick=()=>{$('#th').classList.add('hide');$('#pf').classList.add('hide');S.cur=null;history.replaceState(null,'','#');renderList();};
const URL_RE=/(https?:\/\/[^\s<>"']+)/g;
const fmt=t=>String(t||'').split(URL_RE).map((p,i)=>i%2?`<a href="${esc(p)}" target="_blank" rel="noopener noreferrer">${esc(p.length>70?p.slice(0,67)+'…':p)}</a>`:esc(p)).join('');
function bub(m){
 if(m.recalled)return `<div class="b rc" data-mid="${m.id}">Đã thu hồi${m.orig?`<s>${esc((()=>{try{const o=JSON.parse(m.orig);return o.body||(o.att?'[Ảnh/video]':'[Thẻ đơn]');}catch(e){return'';}})())}</s>`:''}</div>`;
 let h=m.f==='note'?'<span class="nt"><i class="fa-solid fa-lock"></i>Ghi chú nội bộ · khách không thấy</span>':'';
 if(m.reply)h+=`<span class="q" data-jump="${m.reply.id}"><i class="fa-solid fa-reply"></i> ${esc(m.reply.f==='k'?'Khách':(m.reply.name||'NV'))}: ${esc(m.reply.recalled?'Tin đã thu hồi':m.reply.body||(m.reply.vid?'[Video]':m.reply.img?'[Ảnh]':'[Thẻ đơn]'))}</span>`;
 if(m.card)h+=`<div class="ocard"><span class="ci"><i class="fa-solid ${m.card.t==='pay'?'fa-file-invoice-dollar':(KI[m.card.k]||'fa-box')}"></i></span><span><b>${m.card.t==='pay'?'Yêu cầu thanh toán':'Đơn'} ${esc(m.card.code)}</b><small>${esc(KN[m.card.k]||'Đơn hàng')}${m.card.t==='pay'?' · khách bấm là sang trang thanh toán':''}</small></span></div>`;
 if(m.body)h+=(m.card?'<div style="margin-top:6px">':'')+fmt(m.body)+(m.card?'</div>':'');
 const pics=(m.att||[]).filter(a=>a.t!=='v'),vids=(m.att||[]).filter(a=>a.t==='v');
 if(pics.length)h+=`<div class="imgs${pics.length===1?' one':''}">${pics.map(a=>`<img src="/cnimg/${esc(a.id)}.jpg" loading="lazy" data-iv alt="">`).join('')}</div>`;
 h+=vids.map(a=>`<video class="vid" src="/api/chat/f/${esc(a.id)}#t=0.1" controls playsinline preload="metadata"></video>`).join('');
 return `<div class="b" data-mid="${m.id}">${h}</div>`;}
function render(bottom){const box=$('#ms');const near=bottom||box.scrollHeight-box.scrollTop-box.clientHeight<140;const L=S.msgs;
 const I=[];if(S.more)I.push(['more','<div style="text-align:center"><button class="btn sm" data-old style="margin:6px 0">Xem tin cũ hơn</button></div>']);
 if(!L.length)I.push(['empty','<div class="empty"><i class="fa-regular fa-comment-dots"></i>Chưa có tin nhắn. Gõ tin đầu tiên cho khách ở dưới.</div>']);
 let ld='',lastStaff=0;for(const m of L)if(m.f==='s'&&!m.recalled)lastStaff=m.id;
 for(let i=0;i<L.length;i++){const m=L[i],p=L[i-1],n=L[i+1];const d=new Date(m.at).toDateString();if(d!==ld){I.push(['d'+d,`<div class="day"><span>${dayL(m.at)}</span></div>`]);ld=d;}
  if(m.f==='sys'){I.push(['m'+m.id,`<div class="sys"><span><i class="fa-solid fa-robot"></i> ${fmt(m.body)}</span></div>`]);continue;}
  const me=m.f!=='k';const same=(a,b)=>a&&b&&a.f===b.f&&a.by===b.by&&Math.abs(new Date(a.at)-new Date(b.at))<180e3;const first=!same(p,m),last=!same(m,n);
  const nm=m.f==='k'?cname(S.cur):(m.name||m.by||'NV');
  const qh=m.f==='k'&&last&&!m.recalled&&!(m.re&&m.re.length)?`<button class="qh" data-qh="${m.id}" title="Thả tim"><i class="fa-regular fa-heart"></i></button>`:'';
  const tools=m.recalled?'':`<span class="tools">${m.f==='note'?'':`<button data-bar="${m.id}" title="Thả cảm xúc"><i class="fa-regular fa-face-smile"></i></button>`}<button data-rep="${m.id}" title="Trả lời"><i class="fa-solid fa-reply"></i></button><button data-act="${m.id}" title="Thêm"><i class="fa-solid fa-ellipsis"></i></button></span>`;
  I.push(['m'+m.id,`<div class="g${me?' me':''}${m.f==='note'?' note':''}" id="m${m.id}" data-g="${m.id}"><span class="swi"><i class="fa-solid fa-reply"></i></span><span style="${last?'':'visibility:hidden'}">${av(nm,'s')}</span><div class="col">${first?`<span class="wh">${esc(nm)}</span>`:''}<div class="bw">${bub(m)}${qh}</div>${m.re&&m.re.length?`<div class="re">${m.re.map(r=>`<button class="${r.mine?'mine':''}" data-re="${m.id}" data-e="${r.e}">${r.e}${r.n>1?' '+r.n:''}</button>`).join('')}</div>`:''}${last?`<span class="stt">${tHM(m.at)}${m.id===lastStaff?(S.seenC>=m.id?' · <i class="fa-solid fa-check-double" style="color:var(--ok)"></i> Khách đã xem':' · Khách chưa xem'):''}</span>`:''}</div>${tools}</div>`]);}
 const oh=box.scrollHeight,ot=box.scrollTop;patch(box,I);if(near)box.scrollTop=box.scrollHeight;else if(S._pre)box.scrollTop=box.scrollHeight-oh+ot;S._pre=false;
 box.querySelectorAll('img').forEach(im=>{if(!im.complete)im.addEventListener('load',()=>{if(near)box.scrollTop=box.scrollHeight;},{once:true});});}
function upsert(m){const i=S.msgs.findIndex(x=>x.id===m.id);if(i>=0)S.msgs[i]=m;else{S.msgs.push(m);S.msgs.sort((a,b)=>a.id-b.id);}}
async function older(){if(!S.cur||!S.msgs.length)return;try{const j=await getJ('/api/chat/t/'+S.cur.id+'?before='+S.msgs[0].id);S.more=(j.msgs||[]).length>=50;S.msgs=(j.msgs||[]).concat(S.msgs);S._pre=true;render();}catch(e){}}

 if(!card&&(S.att.some(a=>!a.id&&!a.err)||(!body&&!att.length)))return;

 if(!card){inp.value='';S.att=[];renderPv();grow();$('#sug').innerHTML='';}S.reply=null;renderRb();upd();
 try{const j=await post('/api/chat/t/'+S.cur.id+'/send',b);upsert(j.msg);S.cur=Object.assign(S.cur,j.thread);head();render(true);loadSoon();}catch(e){toast(e.message);if(!card&&!inp.value){inp.value=body;grow();upd();}}

function jpg(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{let w=im.naturalWidth,h=im.naturalHeight;const k=Math.min(1,1600/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);URL.revokeObjectURL(u);const go=q=>c.toBlob(b=>{if(!b)return no(new Error('Không đọc được ảnh'));if(b.size>2.8e6&&q>.5)return go(q-.15);ok(b);},'image/jpeg',q);go(.82);};im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('Không đọc được ảnh'));};im.src=u;});}
function upVideo(f,a){return new Promise((ok,no)=>{const x=new XMLHttpRequest();x.open('POST','/api/chat/file');x.setRequestHeader('Content-Type',/^video\//.test(f.type)?f.type:'video/mp4');
 x.upload.onprogress=e=>{if(e.lengthComputable){a.pct=Math.floor(e.loaded/e.total*100);renderPv();}};x.onload=()=>{let j={};try{j=JSON.parse(x.responseText);}catch(e){}if(x.status===200&&j.id)ok(j.id);else no(new Error(j.error||(x.status===413?'Video tối đa 75MB':'Gửi video lỗi')));};x.onerror=()=>no(new Error('Mất mạng khi gửi video'));x.send(f);});}
async function addFiles(fs){if(!S.cur||!fs.length)return;for(const f of fs.slice(0,10-S.att.length)){const v=/^video\//.test(f.type)||/\.(mov|mp4|m4v|webm)$/i.test(f.name||'');
 if(v&&f.size>75*1048576){toast('Video tối đa 75MB (video này '+Math.round(f.size/1048576)+'MB)');continue;}
 const a={url:URL.createObjectURL(f),id:null,err:null,v,pct:0};S.att.push(a);renderPv();upd();
 try{if(v)a.id=await upVideo(f,a);else{const b=await jpg(f);const r=await fetch('/api/cn/upload',{method:'POST',headers:{'Content-Type':'image/jpeg'},body:b});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Tải ảnh lỗi');a.id=j.id;}}catch(e){a.err=e.message;toast(e.message);}renderPv();upd();}}

function bar(mid){const m=S.msgs.find(x=>x.id===mid);if(!m||m.f==='sys'||m.recalled)return;const old=$('.bar');if(old)old.remove();const b=document.querySelector('#m'+mid+' .b');if(!b)return;
 const o=document.createElement('div');o.className='bar';o.innerHTML=(m.f==='note'?'':EMO.map(e=>`<button data-e="${e}" class="${(m.re||[]).some(r=>r.e===e&&r.mine)?'mine':''}">${e}</button>`).join('')+'<i class="sep"></i>')+'<button class="t" data-a="rep"><i class="fa-solid fa-reply"></i> Trả lời</button><button class="t" data-a="more"><i class="fa-solid fa-ellipsis"></i></button>';document.body.appendChild(o);
 const r=b.getBoundingClientRect(),w=o.offsetWidth,h=o.offsetHeight;o.style.left=Math.max(8,Math.min(r.left+r.width/2-w/2,innerWidth-w-8))+'px';o.style.top=(r.top-h-8>50?r.top-h-8:Math.min(r.bottom+8,innerHeight-h-8))+'px';
 const close=e=>{if(!o.contains(e.target)){o.remove();document.removeEventListener('pointerdown',close,true);}};setTimeout(()=>document.addEventListener('pointerdown',close,true),0);
 o.onclick=e=>{const em=e.target.closest('[data-e]'),a=e.target.closest('[data-a]');if(!em&&!a)return;o.remove();document.removeEventListener('pointerdown',close,true);if(em)react(mid,em.dataset.e);else if(a.dataset.a==='rep'){S.reply=m;renderRb();inp.focus();}else acts(mid);};}
let G=null,lastTap={mid:0,at:0};
$('#ms').addEventListener('touchstart',e=>{const row=e.target.closest('.g[data-g]');if(!row)return;const b=e.target.closest('.b[data-mid]');const t=e.touches[0];const mid=+row.dataset.g;
 G={el:row,mid,x:t.clientX,y:t.clientY,dx:0,mode:null,lp:b&&!e.target.closest('video,a')?setTimeout(()=>{if(G&&!G.mode){G.mode='lp';try{navigator.vibrate&&navigator.vibrate(12);}catch(x){}bar(mid);}},420):0};},{passive:true});
$('#ms').addEventListener('touchmove',e=>{if(!G)return;const t=e.touches[0],dx=t.clientX-G.x,dy=t.clientY-G.y;
 if(!G.mode&&(Math.abs(dx)>8||Math.abs(dy)>8)){clearTimeout(G.lp);G.mode=Math.abs(dx)>Math.abs(dy)*1.3&&dx>0?'sw':'scroll';if(G.mode==='sw')G.el.classList.add('sw');}
 if(G.mode==='sw'){G.dx=Math.max(0,Math.min(dx,90));G.el.style.transform='translateX('+G.dx+'px)';const ic=G.el.querySelector('.swi');if(ic)ic.style.opacity=Math.min(1,G.dx/60);}},{passive:true});
$('#ms').addEventListener('touchend',e=>{if(!G)return;clearTimeout(G.lp);const c=G;G=null;
 if(c.mode==='sw'){c.el.classList.remove('sw');c.el.style.transform='';const ic=c.el.querySelector('.swi');if(ic)ic.style.opacity=0;if(c.dx>60){const m=S.msgs.find(x=>x.id===c.mid);if(m&&!m.recalled){S.reply=m;renderRb();inp.focus();}}return;}
 if(c.mode||!e.target.closest('.b[data-mid]')||e.target.closest('a,video,img,.q'))return;const now=Date.now();
 if(lastTap.mid===c.mid&&now-lastTap.at<320){lastTap={mid:0,at:0};e.preventDefault();const m=S.msgs.find(x=>x.id===c.mid);if(m&&m.f!=='note'&&!(m.re||[]).some(r=>r.e==='❤️'&&r.mine))react(c.mid,'❤️');}else lastTap={mid:c.mid,at:now};});
$('#ms').addEventListener('contextmenu',e=>{const b=e.target.closest('.b[data-mid]');if(b&&!e.target.closest('a,video')){e.preventDefault();bar(+b.dataset.mid);}});
$('#ms').onclick=e=>{const a=e.target.closest('[data-act]');if(a){acts(+a.dataset.act);return;}
 const q=e.target.closest('[data-qh]');if(q){react(+q.dataset.qh,'❤️');return;}const br=e.target.closest('[data-bar]');if(br){bar(+br.dataset.bar);return;}
 const rp=e.target.closest('[data-rep]');if(rp){const m=S.msgs.find(x=>x.id===+rp.dataset.rep);if(m){S.reply=m;renderRb();inp.focus();}return;}
 const r=e.target.closest('[data-re]');if(r){react(+r.dataset.re,r.dataset.e);return;}
 if(e.target.closest('[data-old]')){older();return;}const iv=e.target.closest('img[data-iv]');if(iv){const v=document.createElement('div');v.className='iv';v.innerHTML=`<img src="${esc(iv.src)}">`;v.onclick=()=>v.remove();document.body.appendChild(v);return;}
 const j=e.target.closest('[data-jump]');if(j){const el=$('#m'+j.dataset.jump);if(el)el.scrollIntoView({block:'center',behavior:'smooth'});}};
/* ===== cot 3: ho so khach ===== */
function showPf(on){const app=$('#app');if(isM()){$('#pf').classList.toggle('hide',!on);}else{app.classList.toggle('pf',on);$('#pf').classList.toggle('hide',!on);localStorage.setItem('vmt_pf',on?'1':'0');}if(on)loadPf();}
async function loadPf(){if(!S.cur)return;const u=String(S.cur.gobiz||S.cur.u||'').toLowerCase();const box=$('#pf');const nm=cname(S.cur);
 const top=`<div class="pf-h"><button class="ibtn x" data-pfx><i class="fa-solid ${isM()?'fa-arrow-left':'fa-xmark'}"></i></button>${av(nm)}<b>${esc(nm)}</b><small>${esc(u)}${S.cur.ccode?' · '+esc(S.cur.ccode):''}</small></div>`;
 if(S.cur.owner&&S.cur.owner.startsWith('test:')){box.innerHTML=top+'<div class="pf-s">Tài khoản test nội bộ, không phải khách thật.</div>';return;}
 if(!S.pf||S.pf._u!==u){box.innerHTML=top+'<div class="empty">Đang tải…</div>';try{S.pf=await getJ('/api/kh/'+encodeURIComponent(u));S.pf._u=u;}catch(e){S.pf={_u:u,_err:e.message};}}
 const j=S.pf;if(j._err){const x=S.ctx||{};box.innerHTML=top+`<div class="pf-s"><div class="stats">${x.cust&&x.cust.bal!=null?`<div><small>Số dư</small><b>${VND(x.cust.bal)}</b></div>`:''}${x.cust&&x.cust.unpaid?`<div><small>Còn thiếu</small><b style="color:#dc2626">${VND(x.cust.unpaid)}</b></div>`:''}</div><p style="color:var(--s500);font-size:12px">${esc(j._err==='forbidden'?'Tài khoản này không xem được hồ sơ đầy đủ.':j._err)}</p></div>`;return;}
 const c=j.c||{};const snm=x=>x?((j.staff||[]).find(s=>s.u===x)||{n:x}).n:'—';
 const OL=(j.orders||[]).slice(0,25).map(o=>`<div class="oc"><div class="t1"><i class="fa-solid ${KI[o.t]||'fa-box'}" style="color:var(--s400)"></i><b>${esc(o.code)}</b><span class="tag c-slate" style="margin-left:auto">${esc(KN[o.t]||o.t)}</span></div><div class="t2">${esc(o.st||'')}${o.unpaid?` · <b style="color:#dc2626">thiếu ${VND(o.unpaid)}</b>`:''}</div><div class="t3"><button class="btn sm" data-card="${esc(o.code)}" data-k="${o.t}"><i class="fa-solid fa-paper-plane"></i>Gửi thẻ</button>${o.unpaid?`<button class="btn sm" data-pay="${esc(o.code)}" data-k="${o.t}"><i class="fa-solid fa-file-invoice-dollar"></i>Thẻ thanh toán</button>`:''}</div></div>`).join('');
 box.innerHTML=top+`<div class="pf-s"><div class="stats">${c.bal!=null?`<div><small>Số dư Gobiz</small><b>${VND(c.bal)}</b></div>`:''}<div><small>Còn thiếu</small><b style="${c.unpaid?'color:#dc2626':''}">${VND(c.unpaid||0)}</b></div>${j.wallet?`<div><small>Ví mới</small><b>${VND(j.wallet.balance)}</b></div>`:''}</div></div>
<div class="pf-s"><h4>Thông tin</h4><div class="kv">${c.ph?`<span>Điện thoại</span><b><a href="tel:${esc(c.ph)}" style="color:var(--p)">${esc(c.ph)}</a></b>`:''}${c.grp?`<span>Nhóm</span><b>${esc(c.grp)}</b>`:''}<span>Sale</span><b>${esc(snm(c.sale))}</b><span>CSKH</span><b>${esc(snm(c.cskh))}</b></div></div>
<div class="pf-s"><h4>Đơn gần đây <span>${(j.orders||[]).length}</span></h4><div class="ol">${OL||'<span style="color:var(--s500);font-size:12px">Chưa có đơn 30 ngày</span>'}</div></div>
<div class="pf-s"><h4>Lịch sử cuộc chat <button class="btn sm" data-log>Xem</button></h4><div class="lg" id="pfLog"></div></div>`;}
$('#pfBtn').onclick=()=>showPf(isM()?true:!$('#app').classList.contains('pf'));
$('#pf').onclick=async e=>{if(e.target.closest('[data-pfx]')){showPf(false);return;}
 const c=e.target.closest('[data-card]');if(c){sendNow({code:c.dataset.card,k:c.dataset.k});if(isM())showPf(false);return;}
 const p=e.target.closest('[data-pay]');if(p&&confirm('Gửi thẻ "Thanh toán đơn '+p.dataset.pay+'" cho khách?')){sendNow({t:'pay',code:p.dataset.pay,k:p.dataset.k});if(isM())showPf(false);return;}
 if(e.target.closest('[data-log]')){try{const j=await getJ('/api/chat/t/'+S.cur.id+'/log');$('#pfLog').innerHTML=(j.items||[]).map(l=>`<div>${esc(new Date(l.ts).toLocaleString('vi-VN'))} · <b>${esc(l.by==='he-thong'?'Hệ thống':sn(l.by)||l.by||'')}</b> · ${esc(l.action)}${(()=>{try{const d=JSON.parse(l.detail||'{}');return d.to?' → '+esc(sn(d.to)||d.to):'';}catch(x){return'';}})()}</div>`).join('')||'Chưa có';}catch(x){toast(x.message);}}};
/* ===== nhan khach moi ===== */
$('#newBtn').onclick=()=>{const o=dlg(`<h3>Nhắn tin cho khách</h3><input data-q placeholder="Gõ username, mã khách hoặc tên…"><div class="pick" data-l></div><button class="btn" data-x style="margin-top:8px">Đóng</button>`);let t=0;
 o.querySelector('[data-q]').focus();o.querySelector('[data-q]').oninput=e=>{clearTimeout(t);t=setTimeout(async()=>{const q=e.target.value.trim();if(q.length<2){o.querySelector('[data-l]').innerHTML='';return;}try{const j=await getJ('/api/cn/customers?q='+encodeURIComponent(q));o.querySelector('[data-l]').innerHTML=(j.items||[]).map(c=>`<button data-u="${esc(c.u)}">${av(c.fn||c.u,'s')}<span><b>${esc(c.fn||c.u)}</b><small>${esc(c.u)} · ${esc(c.code||'')}</small></span></button>`).join('')||'<p style="color:var(--s500)">Không thấy</p>';}catch(x){}},250);};
 o.addEventListener('click',async e=>{const b=e.target.closest('[data-u]');if(!b)return;o.remove();try{const j=await post('/api/chat/start',{u:b.dataset.u});openT(j.thread.id);load();}catch(x){toast(x.message);}});};
/* ===== am bao + thoi gian thuc ===== */
let ac=null;addEventListener('pointerdown',()=>{if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}else if(ac.state==='suspended')ac.resume();},{passive:true});
const lastS=new Map();function ding(th){if(!soundOn||!ac)return;const n=Date.now();if(n-(lastS.get(th)||0)<60e3){lastS.set(th,n);return;}lastS.set(th,n);try{const t=ac.currentTime;for(const[f,d]of[[880,0],[1320,.11]]){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.setValueAtTime(1e-4,t+d);g.gain.exponentialRampToValueAtTime(.18,t+d+.02);g.gain.exponentialRampToValueAtTime(1e-4,t+d+.22);o.connect(g).connect(ac.destination);o.start(t+d);o.stop(t+d+.25);}}catch(e){}}
$('#sndBtn').onclick=()=>{soundOn=!soundOn;localStorage.setItem('vmt_schat_snd',soundOn?'1':'0');sndIco();toast(soundOn?'Đã bật âm báo':'Đã tắt âm báo');};
function onEv(d){const open=S.cur&&S.cur.id===d.th;
 if(d.t==='msg'||d.t==='upd'){if(open){upsert(d.m);if(d.m.f==='k')S.typT=0;render();typ();if(d.t==='msg'&&d.m.f==='k')markRead();}
  if(d.t==='msg'&&d.m.f==='k'&&(!open||document.hidden))ding(d.th);
  loadSoon();}
 else if(d.t==='read'){if(d.side==='k'&&open){S.seenC=Math.max(S.seenC,d.upto);render();}if(d.side==='s')loadSoon();}
 else if(d.t==='typing'&&open){S.typT=Date.now();typ();setTimeout(typ,5200);}
 else if(d.t==='th')loadSoon();}
function typ(){$('#typ').innerHTML=Date.now()-S.typT<5000?'<i class="fa-solid fa-ellipsis"></i> Khách đang nhập…':'';}
let live=false,pollI=0,helloN=0,lastSum=null;
function lvSet(on){live=on;$('#lv').classList.toggle('on',on);$('#lv').title=on?'Trực tiếp: tin khách hiện ngay':'Đang kết nối lại (tạm hỏi lại 4 giây/lần)';}
function connect(){if(!window.EventSource)return poll();const es=new EventSource('/api/chat/stream');const h=setTimeout(()=>{if(!live){es.close();poll();}},9000);
 es.onmessage=e=>{let d;try{d=JSON.parse(e.data);}catch(x){return;}if(d.t==='hello'){clearTimeout(h);lvSet(true);clearInterval(pollI);if(helloN++)catchUp();return;}onEv(d);};
 es.onerror=()=>{lvSet(false);poll();};}
async function catchUp(){load();if(!S.cur)return;try{const j=await getJ('/api/chat/t/'+S.cur.id+(S.msgs.length?'?after='+S.msgs[S.msgs.length-1].id:''));for(const m of j.msgs||[])upsert(m);S.seenC=j.thread.seenByCust||S.seenC;render();markRead();}catch(e){}}
function poll(){clearInterval(pollI);pollI=setInterval(async()=>{if(live)return clearInterval(pollI);try{const j=await getJ('/api/chat/summary');if(lastSum!==null&&j.lastId>lastSum){ding(0);catchUp();}else if(!document.hidden)catchUp();lastSum=j.lastId;}catch(e){}},4000);}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){load();if(S.cur)catchUp();}});
/* ===== thong bao dien thoai cho nhan vien ===== */
const b64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0));};
async function swReg(){if(!('serviceWorker' in navigator))return null;try{return await navigator.serviceWorker.register('/chat-sw.js');}catch(e){return null;}}
async function pushState(){const r=await swReg();if(!r||!window.PushManager){$('#pushBtn').title='Máy này chưa hỗ trợ thông báo (iPhone: thêm trang vào Màn hình chính trước)';return;}const s=await r.pushManager.getSubscription();$('#pushBtn').classList.toggle('on',!!s);$('#pushBtn').title=s?'Đã bật thông báo trên máy này (bấm để tắt)':'Bật thông báo trên điện thoại';}
$('#pushBtn').onclick=async()=>{const r=await swReg();
 if(!r||!window.PushManager){toast(/iPhone|iPad/.test(navigator.userAgent)?'iPhone: bấm nút Chia sẻ → "Thêm vào MH chính", mở từ icon đó rồi bật lại':'Trình duyệt này chưa hỗ trợ thông báo');return;}
 let s=await r.pushManager.getSubscription();
 if(s){if(!confirm('Tắt thông báo trên máy này?'))return;await post('/api/chat/push/unsub',{endpoint:s.endpoint}).catch(()=>{});await s.unsubscribe();toast('Đã tắt thông báo trên máy này');return pushState();}
 if(await Notification.requestPermission()!=='granted'){toast('Chưa cho phép thông báo. Vào cài đặt trình duyệt bật lại.');return;}
 try{const k=await getJ('/api/chat/push/key');s=await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(k.key)});await post('/api/chat/push/sub',{sub:s.toJSON()});toast('Đã bật. Khách nhắn là máy báo ngay');}catch(e){toast(e.message||'Không bật được');}pushState();};
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',e=>{const u=e.data&&e.data.open;const m=u&&String(u).match(/#t(\d+)/);if(m)openT(+m[1]);});
pushState();
addEventListener('hashchange',()=>{const m=location.hash.match(/^#t(\d+)$/);if(m&&(!S.cur||S.cur.id!==+m[1]))openT(+m[1],true);});
/* giu man hinh dung yen tren dien thoai (ban phim iPhone day trang len) */
(function(){const vv=window.visualViewport;if(!vv)return;const el=$('#app');let lh=0,lt=-1;const fit=()=>{const h=Math.round(vv.height),t=Math.round(vv.offsetTop);if(h!==lh){el.style.setProperty('--vh',h+'px');lh=h;}if(t!==lt){el.style.setProperty('--vt',t+'px');lt=t;}if(window.scrollY)scrollTo(0,0);};vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit,{passive:true});fit();})();
/* phim tat may tinh: Ctrl/⌘+K tim khach · Alt+↑/↓ chuyen cuoc chat · Esc dong */
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#q').focus();$('#q').select();}
 if(e.altKey&&(e.key==='ArrowDown'||e.key==='ArrowUp')&&S.list.length){e.preventDefault();const i=S.cur?S.list.findIndex(t=>t.id===S.cur.id):-1;const n=S.list[Math.max(0,Math.min(S.list.length-1,i+(e.key==='ArrowDown'?1:-1)))];if(n)openT(n.id);}
 if(e.key==='Escape'){const d=document.querySelector('.dlg');if(d)d.remove();const b=$('.bar');if(b)b.remove();}});
/* ===== khoi dong ===== */
if(isM())inp.placeholder='Nhắn khách…';
tplLoad();load().then(()=>{const m=location.hash.match(/^#t(\d+)$/);if(m)openT(+m[1],true);else if(!S.list.length&&S.f==='unread'){S.f='wait';load();}});connect();
</script>
